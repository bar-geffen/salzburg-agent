<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- viewport-fit=cover is what makes env(safe-area-inset-*) return real values
         on iPhone; without it the header sits under the notch when added to the
         home screen. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#FAF7F2" />
    <meta name="apple-mobile-web-app-capable" content="yes" />

    <!-- Fonts as a <link> rather than @import in CSS: the preload scanner finds
         these in the first bytes of HTML and fetches them in parallel with the JS
         bundle. An @import costs a second sequential round trip, which is the
         difference between a fast and a slow first paint on hotel wifi.
         display=swap paints in the fallback immediately either way. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,400;7..72,500&family=Source+Sans+3:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <title>Salzburg 2026</title>

    <!-- Blank-page insurance. Everything else that runs on this page is a module
         script: if the bundle 404s, or throws while evaluating, React never
         mounts, nothing reaches the console the phone can show you, and the page
         is simply white.

         That is exactly what a build made without VITE_SUPABASE_URL /
         VITE_SUPABASE_ANON_KEY produces — the vars are inlined at build time, so
         they become `undefined`, the throw in src/lib/supabase.js turns
         statically reachable, the minifier drops the app as dead code, and the
         deploy still goes green. vite.config.js now fails that build outright,
         but a deploy built before that guard existed stays aliased until the
         next successful one replaces it.

         This runs before the bundle and paints the reason instead. It is
         deliberately dependency-free — no bundle, no CSS: the tokens below carry
         literal fallbacks so it still reads if index.css never arrived. -->
    <script>
      ;(function () {
        var errors = []
        var settled = false

        function note(message) {
          if (message && errors.indexOf(message) === -1) errors.push(message)
        }

        function show() {
          var root = document.getElementById('root')
          if (settled || !document.body || (root && root.children.length > 0)) return
          settled = true

          var panel = document.createElement('div')
          panel.id = 'boot-failure'
          panel.setAttribute(
            'style',
            'position:fixed;inset:0;overflow:auto;padding:32px 24px;' +
              'background:var(--paper,#faf7f2);color:var(--ink,#1f1b16);' +
              'font-family:var(--sans,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif);' +
              'font-size:15px;line-height:1.5',
          )

          var title = document.createElement('h1')
          title.textContent = "The app didn't start"
          title.setAttribute(
            'style',
            'margin:0 0 12px;font-family:var(--serif,Georgia,serif);font-size:22px;font-weight:500',
          )
          panel.appendChild(title)

          var lead = document.createElement('p')
          lead.textContent = errors.length
            ? 'It failed to load with:'
            : 'It loaded but never rendered, and reported no error.'
          lead.setAttribute('style', 'margin:0 0 12px;color:var(--muted,#6b635a)')
          panel.appendChild(lead)

          for (var i = 0; i < errors.length; i++) {
            var line = document.createElement('pre')
            line.textContent = errors[i]
            line.setAttribute(
              'style',
              'margin:0 0 10px;padding:12px;border-radius:var(--r-sm,12px);' +
                'background:var(--sand,#f4efe7);border:1px solid var(--line,#efe7da);' +
                'font-family:var(--mono,ui-monospace,Menlo,monospace);font-size:12.5px;' +
                'white-space:pre-wrap;word-break:break-word',
            )
            panel.appendChild(line)
          }

          var hint = document.createElement('p')
          hint.textContent =
            'If that mentions Supabase config, the deploy was built without ' +
            'VITE_SUPABASE_URL and VITE_SUPABASE_ANON_KEY. They are baked into the ' +
            'bundle at build time, so set them for the Production environment in the ' +
            'Vercel project settings and redeploy — an existing build will not pick ' +
            'them up.'
          hint.setAttribute('style', 'margin:8px 0 0;color:var(--muted,#6b635a)')
          panel.appendChild(hint)

          document.body.appendChild(panel)
        }

        // Capture phase so failed <script>/<link> loads are caught too. Those
        // only get recorded — the fonts stylesheet failing is survivable and
        // must not race the bundle into a false alarm. An actual uncaught throw
        // means React will never mount, so that one paints straight away.
        window.addEventListener(
          'error',
          function (event) {
            var target = event.target
            if (target && target !== window && (target.src || target.href)) {
              note('Failed to load ' + (target.src || target.href))
              return
            }
            note(event.message || String(event.error || 'Unknown error'))
            setTimeout(show, 0)
          },
          true,
        )

        window.addEventListener('unhandledrejection', function (event) {
          note((event.reason && event.reason.message) || String(event.reason))
          setTimeout(show, 0)
        })

        // Catch-all for a bundle that never arrives at all. Generous, because a
        // cold cache on hotel wifi is slow, not broken.
        window.addEventListener('load', function () {
          setTimeout(show, 5000)
        })

        // main.jsx calls this once React has painted; after that the in-app error
        // boundary owns failures and this must never fire.
        window.__appMounted = function () {
          settled = true
          var panel = document.getElementById('boot-failure')
          if (panel) panel.remove()
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
